name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Test (minimal features)
        run: cargo test --locked --no-default-features --features minimal

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  validate-examples:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Validate jsonplaceholder example
        run: ./target/release/rqb validate examples/jsonplaceholder/api-docs/

  crate-package:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package crate
        run: cargo package --locked
      - name: Check crates.io size limit
        run: |
          crate="$(ls target/package/reqbook-*.crate)"
          bytes="$(wc -c < "$crate")"
          echo "crate=$crate bytes=$bytes"
          test "$bytes" -lt 10485760

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Build web UI
        run: cd web && npm run build
      - name: Build Reqbook binary
        run: cargo build --locked
      - name: Run flow canvas E2E
        run: cd web && npm run e2e:flow
      - name: Run branch switch E2E
        run: cd web && npm run e2e:branch
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: target/e2e-artifacts
          if-no-files-found: ignore

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/vscode/package-lock.json
      - name: Test and package extension
        run: |
          cd packages/vscode
          npm ci
          npm test
          npm run check
          npm run package -- --out /tmp/reqbook-vscode.vsix --no-dependencies
