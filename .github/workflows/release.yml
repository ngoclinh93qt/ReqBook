name: release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Validate package versions
        run: |
          tag_version="${RELEASE_TAG#v}"
          cargo metadata --no-deps --format-version 1 > /tmp/reqbook-cargo-metadata.json
          cargo_version="$(python3 -c 'import json; meta=json.load(open("/tmp/reqbook-cargo-metadata.json")); print(next(p["version"] for p in meta["packages"] if p["name"] == "reqbook"))')"
          tauri_cargo_version="$(python3 -c 'import json; meta=json.load(open("/tmp/reqbook-cargo-metadata.json")); print(next(p["version"] for p in meta["packages"] if p["name"] == "rqb-desktop"))')"
          tauri_config_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          npm_version="$(node -p "require('./packages/npm/package.json').version")"
          vscode_version="$(node -p "require('./packages/vscode/package.json').version")"

          echo "Resolved release versions:"
          echo "  tag:                          $tag_version"
          echo "  Cargo.toml:                   $cargo_version"
          echo "  src-tauri/Cargo.toml:         $tauri_cargo_version"
          echo "  src-tauri/tauri.conf.json:    $tauri_config_version"
          echo "  packages/npm/package.json:    $npm_version"
          echo "  packages/vscode/package.json: $vscode_version"

          mismatch=0
          check_version() {
            label="$1"
            actual="$2"
            if [ "$actual" != "$tag_version" ]; then
              echo "::error title=Release version mismatch::$label is $actual but release tag $RELEASE_TAG requires $tag_version."
              mismatch=1
            fi
          }

          check_version "Cargo.toml" "$cargo_version"
          check_version "src-tauri/Cargo.toml" "$tauri_cargo_version"
          check_version "src-tauri/tauri.conf.json" "$tauri_config_version"
          check_version "packages/npm/package.json" "$npm_version"
          check_version "packages/vscode/package.json" "$vscode_version"

          if [ "$mismatch" -ne 0 ]; then
            echo "Create release tags only from commits whose package versions already match the tag." >&2
            exit 1
          fi
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features --features minimal
      - run: cargo build --locked
      - run: cd web && npm run e2e:flow
      - run: cd web && npm run e2e:branch
      - run: cargo run --bin rqb -- validate api-docs
      - name: Package crate
        run: cargo package --locked
      - name: Check crates.io size limit
        run: |
          crate="$(ls target/package/reqbook-*.crate)"
          bytes="$(wc -c < "$crate")"
          echo "crate=$crate bytes=$bytes"
          test "$bytes" -lt 10485760
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: target/e2e-artifacts
          if-no-files-found: ignore

  build-binaries:
    needs: checks
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rqb staging/
          archive="rqb-${{ matrix.target }}.tar.xz"
          tar -cJf "$archive" -C staging rqb
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging
          Copy-Item target/${{ matrix.target }}/release/rqb.exe staging/
          $archive = "rqb-${{ matrix.target }}.zip"
          Compress-Archive -Path staging/rqb.exe -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rqb-${{ matrix.target }}
          path: rqb-${{ matrix.target }}.*
          if-no-files-found: error

  github-release:
    needs:
      - build-binaries
      - vscode-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: rqb-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/
      - name: Verify release assets
        run: |
          cat > expected-release-assets.txt <<EOF
          rqb-x86_64-unknown-linux-musl.tar.xz
          rqb-x86_64-unknown-linux-musl.tar.xz.sha256
          rqb-aarch64-unknown-linux-musl.tar.xz
          rqb-aarch64-unknown-linux-musl.tar.xz.sha256
          rqb-x86_64-apple-darwin.tar.xz
          rqb-x86_64-apple-darwin.tar.xz.sha256
          rqb-aarch64-apple-darwin.tar.xz
          rqb-aarch64-apple-darwin.tar.xz.sha256
          rqb-x86_64-pc-windows-msvc.zip
          rqb-x86_64-pc-windows-msvc.zip.sha256
          reqbook-vscode-${RELEASE_TAG}.vsix
          EOF
          sed -i 's/^ *//' expected-release-assets.txt

          missing=0
          while IFS= read -r asset; do
            if [ ! -f "dist/$asset" ]; then
              echo "missing release asset: dist/$asset" >&2
              missing=1
            fi
          done < expected-release-assets.txt
          if [ "$missing" -ne 0 ]; then
            echo "available files:" >&2
            find dist -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=0
          while IFS= read -r asset; do
            if ! printf '%s\n' "$published" | grep -qx "$asset"; then
              echo "missing published release asset: $asset" >&2
              missing=1
            fi
          done < expected-release-assets.txt
          if [ "$missing" -ne 0 ]; then
            echo "published assets:" >&2
            printf '%s\n' "$published" | sort >&2
            exit 1
          fi

  vscode-package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - name: Package VS Code extension
        run: |
          mkdir -p dist
          cd packages/vscode
          npm ci
          npm test
          npm run check
          npm run package -- --out ../../dist/reqbook-vscode-${{ env.RELEASE_TAG }}.vsix --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/*.vsix
          if-no-files-found: error

  vscode-marketplace:
    needs: vscode-package
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_VSCODE == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/
      - name: Publish to Visual Studio Marketplace
        id: vscode-marketplace-publish
        run: |
          cd packages/vscode
          npm ci
          version="$(node -p "require('./package.json').version")"
          extension_id="$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")"
          if npm exec -- vsce show "$extension_id" --json > marketplace.json 2>/dev/null; then
            if node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('marketplace.json','utf8')); const version=process.argv[1]; process.exit((data.versions||[]).some(item => item.version === version) ? 0 : 1)" "$version"; then
              echo "$extension_id v$version already exists on Visual Studio Marketplace; skipping publish."
              exit 0
            fi
          fi
          npm exec -- vsce publish --packagePath ../../dist/*.vsix --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    needs: vscode-package
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_OPEN_VSX == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/
      - name: Publish to Open VSX
        run: |
          cd packages/vscode
          npm ci
          version="$(node -p "require('./package.json').version")"
          extension_id="$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")"
          if npm exec -- ovsx get "$extension_id" --metadata -v "$version" >/dev/null 2>&1; then
            echo "$extension_id v$version already exists on Open VSX; skipping publish."
            exit 0
          fi
          npm exec -- ovsx publish ../../dist/*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  cargo-publish:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if cargo search reqbook --limit 5 | grep -Eq "^reqbook = \"$version\""; then
            echo "reqbook v$version already exists on crates.io; skipping publish."
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name v$version already exists on npm; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository_owner }}/rqb:${{ env.RELEASE_TAG }},ghcr.io/${{ github.repository_owner }}/rqb:latest
