name: release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v, got: $RELEASE_TAG" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features --features minimal
      - run: cargo build --locked
      - run: cd web && npm run e2e:flow
      - run: cd web && npm run e2e:branch
      - run: cargo run --bin rqb -- validate api-docs
      - name: Package crate
        run: cargo package --locked
      - name: Check crates.io size limit
        run: |
          crate="$(ls target/package/reqbook-*.crate)"
          bytes="$(wc -c < "$crate")"
          echo "crate=$crate bytes=$bytes"
          test "$bytes" -lt 10485760
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: target/e2e-artifacts
          if-no-files-found: ignore

  build-binaries:
    needs: checks
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/rqb staging/
          tar -cJf rqb-${{ matrix.target }}.tar.xz -C staging rqb
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging
          Copy-Item target/${{ matrix.target }}/release/rqb.exe staging/
          Compress-Archive -Path staging/rqb.exe -DestinationPath rqb-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rqb-${{ matrix.target }}
          path: rqb-${{ matrix.target }}.*

  github-release:
    needs:
      - build-binaries
      - vscode-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

  vscode-package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - name: Package VS Code extension
        run: |
          mkdir -p dist
          cd packages/vscode
          npm ci
          npm test
          npm run check
          npm run package -- --out ../../dist/reqbook-vscode-${{ env.RELEASE_TAG }}.vsix --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/*.vsix

  vscode-marketplace:
    needs: vscode-package
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_VSCODE == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/
      - name: Publish to Visual Studio Marketplace
        run: |
          cd packages/vscode
          npm ci
          npm exec -- vsce publish --packagePath ../../dist/*.vsix --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    needs: vscode-package
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_OPEN_VSX == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: reqbook-vscode
          path: dist/
      - name: Publish to Open VSX
        run: |
          cd packages/vscode
          npm ci
          npm exec -- ovsx publish ../../dist/*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  cargo-publish:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance --access public
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository_owner }}/rqb:${{ env.RELEASE_TAG }},ghcr.io/${{ github.repository_owner }}/rqb:latest
