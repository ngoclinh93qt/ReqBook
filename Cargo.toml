[package]
name = "reqbook"
version = "0.2.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["ngoclinh93qt"]
description = "Reqbook is executable API documentation for humans, CI, and coding agents."
repository = "https://github.com/ngoclinh93qt/ReqBook"
homepage = "https://markapidown.net"
documentation = "https://docs.markapidown.net"
readme = "README.md"
keywords = ["api", "markdown", "cli", "testing", "agents"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [
  ".claude/**",
  ".github/**",
  "api-docs/**",
  "assets/**",
  "benchmarks/**",
  "docs/**",
  "examples/**",
  "packages/**",
  "plan.md",
  "scripts/**",
  "skill-templates/**",
  "wix/**",
  "web/node_modules/**",
  "web/src/**",
  "web/public/**",
  "web/package.json",
  "web/package-lock.json",
  "web/index.html",
  "web/tsconfig*.json",
  "web/vite.config.ts",
]

[lib]
name = "reqbook"
path = "src/lib.rs"

[[bin]]
name = "rqb"
path = "src/main.rs"

[features]
default = ["web", "install"]
web = ["dep:axum", "dep:rust-embed", "dep:mime_guess", "dep:tokio-stream"]
install = []
minimal = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
clap = { version = "=4.5.23", features = ["derive"] }
clap_complete = "=4.5.40"
dialoguer = "0.11"
http = "1.1"
owo-colors = "4.0"
pulldown-cmark = "0.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_path = "0.7"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time", "io-std", "sync"] }
tokio-stream = { version = "0.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
walkdir = "2.5"

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
tempfile = "3.10"
wiremock = "0.6"

[[bench]]
name = "parse_endpoint"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

[workspace]
members = [".", "src-tauri"]
resolver = "2"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew", "npm", "msi"]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
install-path = "~/.local/bin"
tap = "reqbook/homebrew-tap"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
allow-dirty = ["ci"]

[package.metadata.wix]
upgrade-guid = "CCF909E6-11F5-4899-BBF0-E7EDBAE416A4"
path-guid = "9D7098F7-2FB2-4E67-AA5E-E3C9361FD22C"
license = false
eula = false
