[package]
name = "trellis"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Markdown-native API specs with execution, pipelines, and cross-agent workflows."
repository = "https://github.com/trellis-md/trellis"

[lib]
name = "trellis"
path = "src/lib.rs"

[[bin]]
name = "trellis"
path = "src/main.rs"

[features]
default = ["web", "install"]
web = ["dep:axum", "dep:askama", "dep:tokio-stream"]
install = ["dep:dirs", "dep:walkdir"]
minimal = []

[dependencies]
anyhow = "1.0"
askama = { version = "0.12", optional = true }
axum = { version = "0.7", optional = true }
clap = { version = "4.5", features = ["derive"] }
http = "1.1"
owo-colors = "4.0"
pulldown-cmark = "0.10"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_path = "0.7"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = { version = "5.0", optional = true }
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
tempfile = "3.10"
wiremock = "0.6"

[[bench]]
name = "parse_endpoint"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
